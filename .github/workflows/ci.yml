name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            skills/jobra/requirements.txt
            .github/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r skills/jobra/requirements.txt -r .github/requirements-ci.txt

      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v

      - name: Validate plugin and repository JSON
        run: |
          python -m json.tool plugin.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path("plugin.json"), *Path("skills/jobra/references").glob("*.json")]
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(paths)} JSON files.")
          for path in Path("skills/jobra/scripts").glob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print("Validated Python script syntax.")
          PY

      - name: Validate Jobra skill
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output "$RUNNER_TEMP/quick_validate.py"
          python "$RUNNER_TEMP/quick_validate.py" skills/jobra

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --root HEAD
          fi
